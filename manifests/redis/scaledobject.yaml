apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: redis-scaledobject
  namespace: default
spec:
  scaleTargetRef:
    name: redis-worker
  minReplicaCount: 0               # 0 = Scale to Zero 활성화
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    - type: redis
      metadata:
        address: redis-service:6379
        listName: my-task-queue    # 감시할 Redis List 키 이름
        listLength: "10"           # 파드 1개당 처리할 List 항목 수
        activationListLength: "1"  # 이 값 이상일 때 Scale from Zero
        databaseIndex: "0"
        enableTLS: "false"
      authenticationRef:
        name: redis-trigger-auth   # 인증 불필요 시 이 블록 전체 제거
