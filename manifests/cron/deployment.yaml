apiVersion: apps/v1
kind: Deployment
metadata:
  name: cron-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cron-worker
  template:
    metadata:
      labels:
        app: cron-worker
    spec:
      containers:
        - name: worker
          image: nginx:alpine
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
