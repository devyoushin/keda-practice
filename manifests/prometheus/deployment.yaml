apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-worker
  template:
    metadata:
      labels:
        app: prometheus-worker
    spec:
      containers:
        - name: worker
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
