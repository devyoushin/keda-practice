apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: prometheus-scaledobject
  namespace: default
spec:
  scaleTargetRef:
    name: prometheus-worker
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring:9090
        metricName: http_requests_per_second   # HPA에 표시될 메트릭 이름 (임의 지정)
        # 파드 1개당 초당 100 RPS 처리
        query: sum(rate(http_requests_total{job="prometheus-worker"}[2m]))
        threshold: "100"
        activationThreshold: "10"              # 10 RPS 이하일 때는 스케일 아웃 안 함
