apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: default
spec:
  replicas: 0                    # KEDA가 관리하므로 초기값 0
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      containers:
        - name: consumer
          image: confluentinc/cp-kafka:7.5.0
          command:
            - kafka-console-consumer.sh
            - --bootstrap-server
            - kafka:9092
            - --topic
            - my-topic
            - --group
            - my-consumer-group
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC
              value: "my-topic"
            - name: KAFKA_CONSUMER_GROUP
              value: "my-consumer-group"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
